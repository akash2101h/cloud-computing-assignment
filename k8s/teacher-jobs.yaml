apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-shard-0
  namespace: pipeline
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: teacher-worker:1
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_INDEX, value: "0"}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://172.24.118.91:11434"}
          envFrom:
            - secretRef:
                name: seaweed-s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-shard-1
  namespace: pipeline
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: teacher-worker:1
          imagePullPolicy: IfNotPresent
          env:
            - {name: SHARD_INDEX, value: "1"}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://172.24.118.91:11434"}
          envFrom:
            - secretRef:
                name: seaweed-s3
